name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — skip ASC upload and GitHub Release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build, Export, Upload, Release
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release@24 \
            @semantic-release/commit-analyzer@13 \
            @semantic-release/release-notes-generator@14 \
            @semantic-release/github@11

      - name: Determine next version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          semantic-release --dry-run 2>&1 | tee "$RUNNER_TEMP/semantic-release.log"
          if grep -qE 'There are no relevant changes|no new version is released' "$RUNNER_TEMP/semantic-release.log"; then
            echo "No releasable commits since last release. Nothing to do."
            exit 0
          fi
          NEW_VERSION="$(grep -oE 'The next release version is [0-9]+\.[0-9]+\.[0-9]+' "$RUNNER_TEMP/semantic-release.log" | tail -1 || true)"
          if [ -z "$NEW_VERSION" ]; then
            echo "::error::semantic-release did not report a next version. See the semantic-release log in artifacts." >&2
            exit 1
          fi
          NEW_VERSION="$(echo "$NEW_VERSION" | sed -E 's/.*is ([0-9]+\.[0-9]+\.[0-9]+)/\1/')"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Install signing certificate
        if: env.NEW_VERSION != ''
        env:
          DISTRIBUTION_CERTIFICATE: ${{ secrets.DISTRIBUTION_CERTIFICATE }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          echo "$DISTRIBUTION_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 12)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/release.keychain" -P "$DISTRIBUTION_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain" >/dev/null 2>&1 || true
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain"

      - name: Install provisioning profiles
        if: env.NEW_VERSION != ''
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          PROVISIONING_PROFILE_WATCH: ${{ secrets.PROVISIONING_PROFILE_WATCH }}
        run: |
          set -euo pipefail

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          install_profile() {
            local PLATFORM="$1"
            local PROFILE_BASE64="$2"

            local PROFILE_PATH="$RUNNER_TEMP/${PLATFORM}.mobileprovision"
            local PROFILE_PLIST="$RUNNER_TEMP/${PLATFORM}-profile.plist"

            echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

            if [ ! -s "$PROFILE_PATH" ]; then
              echo "::error::Decoded ${PLATFORM} provisioning profile is empty"
              exit 1
            fi

            echo "${PLATFORM} provisioning profile decoded ($(wc -c < "$PROFILE_PATH") bytes)"

            security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

            if [ ! -s "$PROFILE_PLIST" ]; then
              echo "::error::security cms failed to decode ${PLATFORM} provisioning profile"
              exit 1
            fi

            local PROFILE_UUID
            local PROFILE_NAME
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")

            echo "${PLATFORM} profile UUID: $PROFILE_UUID"
            echo "${PLATFORM} profile Name: $PROFILE_NAME"

            cp "$PROFILE_PATH" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"

            echo "PROFILE_NAME_${PLATFORM}=$PROFILE_NAME" >> "$GITHUB_ENV"
          }

          if [ -z "${PROVISIONING_PROFILE:-}" ]; then
            echo "::error::PROVISIONING_PROFILE secret is empty or unavailable"
            exit 1
          fi
          if [ -z "${PROVISIONING_PROFILE_WATCH:-}" ]; then
            echo "::error::PROVISIONING_PROFILE_WATCH secret is empty or unavailable"
            exit 1
          fi

          install_profile "IOS" "$PROVISIONING_PROFILE"
          install_profile "WATCH" "$PROVISIONING_PROFILE_WATCH"

      - name: Dry run — skip publish
        if: env.NEW_VERSION != '' && inputs.dry_run == true
        run: |
          echo "::notice::Dry run mode — skipping App Store Connect upload and GitHub Release."

      - name: Setup App Store Connect API key
        if: env.NEW_VERSION != '' && inputs.dry_run == false
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"

      - name: Generate CI xcconfig
        if: env.NEW_VERSION != ''
        run: |
          cat > "$RUNNER_TEMP/ci-release.xcconfig" <<XCEOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = 64C39764NA
          CODE_SIGN_IDENTITY = Apple Distribution

          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME_IOS}
          PROVISIONING_PROFILE_SPECIFIER[sdk=watchos*] = ${PROFILE_NAME_WATCH}
          XCEOF

          echo "Generated ci-release.xcconfig:"
          cat "$RUNNER_TEMP/ci-release.xcconfig"

      - name: Xcode version
        if: env.NEW_VERSION != ''
        run: |
          xcodebuild -version
          echo "DEVELOPER_DIR: ${DEVELOPER_DIR:-<not set>}"
          echo "SDK platforms:"
          xcodebuild -showsdks 2>/dev/null | head -20 || true

      - name: Build archive
        if: env.NEW_VERSION != ''
        run: |
          set +e
          set -o pipefail

          xcodebuild archive \
            -project "2FAuth.xcodeproj" \
            -scheme "2FAuth" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/2FAuth.xcarchive" \
            -xcconfig "$RUNNER_TEMP/ci-release.xcconfig" \
            MARKETING_VERSION="$NEW_VERSION" \
            | tee "$RUNNER_TEMP/xcodebuild-archive.log"

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "::group::Signing/build errors"
            grep -Ei \
              'error:|provisioning profile|codesign|signing certificate|requires a provisioning profile|doesn.t match' \
              "$RUNNER_TEMP/xcodebuild-archive.log" || true
            echo "::endgroup::"
            exit "$STATUS"
          fi

      - name: Generate ExportOptions.plist
        if: env.NEW_VERSION != ''
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>

              <key>teamID</key>
              <string>64C39764NA</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.ryanep.2fauth</key>
                  <string>${PROFILE_NAME_IOS}</string>

                  <key>com.ryanep.2fauth.watchos</key>
                  <string>${PROFILE_NAME_WATCH}</string>
              </dict>
          </dict>
          </plist>
          EOF

          echo "Generated ExportOptions.plist:"
          /usr/libexec/PlistBuddy -c Print "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        if: env.NEW_VERSION != ''
        run: |
          set +e
          set -o pipefail

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/2FAuth.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            | tee "$RUNNER_TEMP/xcodebuild-export.log"

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "::group::Export errors"
            grep -Ei \
              'error:|provisioning profile|codesign|signing certificate|requires a provisioning profile|doesn.t match' \
              "$RUNNER_TEMP/xcodebuild-export.log" || true
            echo "::endgroup::"
            exit "$STATUS"
          fi

      - name: Upload to App Store Connect
        if: env.NEW_VERSION != '' && inputs.dry_run == false
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/export" -type f -name '*.ipa' -print -quit)"

          if [ -z "$IPA_PATH" ]; then
            echo "::error::No IPA produced by exportArchive"
            find "$RUNNER_TEMP/export" -maxdepth 3 -type f -print || true
            exit 1
          fi

          echo "Uploading: $IPA_PATH"

          set -o pipefail
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            | tee "$RUNNER_TEMP/altool-upload.log"

      - name: Create GitHub Release
        if: env.NEW_VERSION != '' && inputs.dry_run == false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-logs
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/semantic-release.log
            ${{ runner.temp }}/xcodebuild-archive.log
            ${{ runner.temp }}/xcodebuild-export.log
            ${{ runner.temp }}/altool-upload.log
